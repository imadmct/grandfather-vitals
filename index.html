<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101417"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Critical Care Log</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>:root{--bg:#0d1114;--panel:#151b20;--panel2:#1b2329;--line:#2b353c;--txt:#f4f7f8;--muted:#9cabb5;--blue:#70b7ff;--green:#6ed49b;--amber:#f3c969;--red:#ff7b73;--r:16px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}body{padding-bottom:88px}.wrap{max-width:680px;margin:auto;padding:0 14px}header{padding:calc(env(safe-area-inset-top,0px) + 16px) 2px 8px;position:sticky;top:0;background:rgba(13,17,20,.95);backdrop-filter:blur(14px);z-index:5;border-bottom:1px solid rgba(43,53,60,.65)}h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.body{padding:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.latest{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}.metric{background:var(--panel);padding:12px 10px;min-height:85px}.metric b{display:block;font-size:25px;line-height:1.1}.metric small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.metric .unit{font-size:10px;color:var(--muted);margin-left:3px}.f label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin:0 0 5px 2px}.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--txt);padding:12px 10px;font-size:18px;min-height:46px}.f textarea{font-size:15px;min-height:76px;resize:vertical}.f select{font-size:15px}.btn{width:100%;border:0;border-radius:12px;min-height:50px;background:#e9f3ff;color:#09131b;font-weight:700;font-size:16px}.btn.secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}.btn.danger{background:transparent;color:var(--red);border:1px solid #56302e}.row{display:flex;gap:8px}.row>*{flex:1}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;padding:8px 10px;font-size:12px}.chip.on{background:#dceeff;color:#08131b;border-color:#dceeff}.timeline .item{padding:12px;border-bottom:1px solid var(--line)}.time{font-size:12px;color:var(--blue);font-weight:700}.vals{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px}.vals span{font-size:14px}.vals i{font-style:normal;color:var(--muted);font-size:10px;text-transform:uppercase;margin-right:4px}.note{margin-top:7px;color:#c5d0d6;font-size:13px}.tag{display:inline-block;margin:6px 5px 0 0;padding:3px 7px;border-radius:999px;background:#202a31;color:#cbd6dc;font-size:10px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary>div{background:var(--panel2);padding:10px;border-radius:12px}.summary small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.summary b{font-size:18px}nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,17,20,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}.tabs{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.tab{background:none;border:0;color:var(--muted);padding:12px 4px 10px;font-size:11px;font-weight:700}.tab.active{color:var(--blue)}.hint{font-size:12px;color:var(--muted);line-height:1.45}.sep{height:1px;background:var(--line);margin:12px 0}.empty{padding:28px 16px;text-align:center;color:var(--muted)}@media(max-width:390px){.latest{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><header><h1>Critical Care Log</h1><div class="sub">Private, on this phone only</div></header><main id="app"></main></div><nav><div class="tabs"><button class="tab active" data-v="dash">Now</button><button class="tab" data-v="add">Add</button><button class="tab" data-v="history">Timeline</button><button class="tab" data-v="data">Data</button></div></nav><script>const KEY='critical-care-log-v1';let db=load(),view='dash',selectedTags=[];function load(){try{return JSON.parse(localStorage.getItem(KEY))||{entries:[]}}catch{return{entries:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function nowLocal(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,16)}function fmt(ts){return new Date(ts).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}function n(v){const x=parseFloat(v);return Number.isFinite(x)?x:null}function latestVal(k){for(const e of [...db.entries].sort((a,b)=>new Date(b.ts)-new Date(a.ts)))if(e[k]!=null)return e[k];return null}function total(k){return db.entries.reduce((s,e)=>s+(Number(e[k])||0),0)}function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.v===view));$('#app').innerHTML=view==='dash'?dash():view==='add'?add():view==='history'?history():data();bind()}function m(label,val,unit=''){return `<div class="metric"><small>${label}</small><b>${val??'–'}<span class="unit">${unit}</span></b></div>`}function dash(){const e=[...db.entries].sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0];if(!e)return `<div class="card"><div class="empty">No entries yet.<br>Tap <b>Add</b> and log the current readings.</div></div>`;const map=e.map??(e.sys&&e.dia?Math.round((e.sys+2*e.dia)/3):null),bal=total('ivIn')+total('enteralIn')-total('urineOut');return `<div class="card"><div class="head"><span>Latest</span><span>${fmt(e.ts)}</span></div><div class="latest">${m('BP',e.sys&&e.dia?`${e.sys}/${e.dia}`:'–','mmHg')}${m('MAP',map,'mmHg')}${m('HR',e.hr,'bpm')}${m('SpO₂',e.spo2,'%')}${m('RR',e.rr,'/min')}${m('O₂',e.o2flow,'L/min')}${m('Norad',e.norad,'µg/kg/min')}${m('Adrenaline',e.adrenaline,'µg/kg/min')}${m('Lactate',e.lactate,'mmol/L')}</div></div><div class="card"><div class="head">Fluid balance</div><div class="body"><div class="summary"><div><small>Total input</small><b>${total('ivIn')+total('enteralIn')} mL</b></div><div><small>Urine</small><b>${total('urineOut')} mL</b></div><div><small>Net</small><b>${bal>=0?'+':''}${bal} mL</b></div></div></div></div><div class="card"><div class="head">Latest labs</div><div class="latest">${m('pH',latestVal('ph'))}${m('HCO₃',latestVal('hco3'),'mmol/L')}${m('Hb',latestVal('hb'),'g/dL')}${m('Creat',latestVal('creatinine'),'µmol/L')}${m('Troponin',latestVal('troponin'),'ng/L')}${m('K',latestVal('potassium'),'mmol/L')}</div></div>`}function fld(id,label,type='number',step='any'){return `<div class="f"><label>${label}</label><input id="${id}" type="${type}" ${type==='number'?`step="${step}" inputmode="decimal"`:''}></div>`}function add(){return `<div class="card"><div class="head">Timestamp</div><div class="body"><div class="f"><label>Time of reading / event</label><input id="ts" type="datetime-local" value="${nowLocal()}"></div></div></div><div class="card"><div class="head">Vitals</div><div class="body"><div class="grid3">${fld('sys','Systolic BP')}${fld('dia','Diastolic BP')}${fld('map','MAP')}${fld('hr','Heart rate')}${fld('spo2','SpO₂')}${fld('rr','Resp rate')}${fld('temp','Temperature','number','0.1')}</div></div></div><div class="card"><div class="head">Oxygen</div><div class="body"><div class="grid"><div class="f"><label>Device</label><select id="o2device"><option value="">Not entered</option><option>Nasal cannula</option><option>Simple mask</option><option>Non-rebreather mask</option><option>High-flow nasal oxygen</option><option>NIV / BiPAP</option><option>Ventilator</option><option>Room air</option></select></div>${fld('o2flow','O₂ flow (L/min)')}</div></div></div><div class="card"><div class="head">Vasopressors</div><div class="body"><div class="grid">${fld('norad','Noradrenaline (µg/kg/min)','number','0.01')}${fld('noradml','Norad pump (mL/hr)','number','0.1')}${fld('adrenaline','Adrenaline (µg/kg/min)','number','0.01')}${fld('adrenalineml','Adrenaline pump (mL/hr)','number','0.1')}</div></div></div><div class="card"><div class="head">Fluids & urine since last entry</div><div class="body"><div class="grid3">${fld('ivIn','IV input (mL)')}${fld('enteralIn','Feed/input (mL)')}${fld('urineOut','Urine (mL)')}</div></div></div><div class="card"><div class="head">Labs</div><div class="body"><div class="grid3">${fld('lactate','Lactate','number','0.01')}${fld('ph','pH','number','0.01')}${fld('hco3','HCO₃','number','0.1')}${fld('hb','Hb g/dL','number','0.1')}${fld('creatinine','Creatinine','number','1')}${fld('troponin','Troponin ng/L','number','1')}${fld('sodium','Sodium','number','0.1')}${fld('potassium','Potassium','number','0.1')}</div></div></div><div class="card"><div class="head">Event / note</div><div class="body"><div class="chips">${['BP drop','O₂ drop','HR spike','Fluid bolus','Blood transfusion','Norad ↑','Norad ↓','Adrenaline started','ABG','CBC','Ultrasound','Suction'].map(t=>`<button class="chip" type="button" data-tag="${t}">${t}</button>`).join('')}</div><div class="f" style="margin-top:12px"><label>Notes</label><textarea id="notes"></textarea></div><button class="btn" id="saveEntry" style="margin-top:12px">Save timestamped entry</button></div></div>`}function history(){const arr=[...db.entries].sort((a,b)=>new Date(b.ts)-new Date(a.ts));if(!arr.length)return `<div class="card"><div class="empty">No timeline entries yet.</div></div>`;return `<div class="card timeline">${arr.map(e=>{let xs=[];if(e.sys||e.dia)xs.push(`<span><i>BP</i>${e.sys??'–'}/${e.dia??'–'}</span>`);for(const[k,l,u]of[['map','MAP',''],['hr','HR',''],['spo2','SpO₂','%'],['rr','RR',''],['o2flow','O₂','L'],['norad','Norad',''],['adrenaline','Adr',''],['lactate','Lact',''],['ph','pH',''],['hb','Hb',''],['urineOut','Urine','mL']])if(e[k]!=null)xs.push(`<span><i>${l}</i>${e[k]}${u}</span>`);return `<div class="item"><div class="time">${fmt(e.ts)}</div><div class="vals">${xs.join('')}</div>${e.tags?.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||''}${e.notes?`<div class="note">${esc(e.notes)}</div>`:''}<button class="chip" data-del="${e.id}" style="margin-top:8px">Delete</button></div>`}).join('')}</div>`}function data(){return `<div class="card"><div class="head">Family report</div><div class="body"><p class="hint">Creates a family-friendly PDF directly on this phone, then opens the iPhone share sheet.</p><button class="btn" id="familyPdf">Generate & Share Family PDF</button><div id="pdfStatus" class="hint" style="margin-top:9px"></div></div></div><div class="card"><div class="head">Backup</div><div class="body"><div class="row"><button class="btn secondary" id="exportJson">Export JSON</button><button class="btn secondary" id="exportCsv">Export CSV</button></div><div class="sep"></div><div class="f"><label>Import backup</label><input id="importFile" type="file" accept="application/json,.json"></div><button class="btn danger" id="clearAll" style="margin-top:12px">Delete all local data</button></div></div>`}function val(id){const el=$('#'+id);return el?el.value:''}function bind(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{const t=b.dataset.tag;b.classList.toggle('on');selectedTags=b.classList.contains('on')?[...selectedTags,t]:selectedTags.filter(x=>x!==t)});if($('#saveEntry'))$('#saveEntry').onclick=()=>{const e={id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),ts:val('ts'),tags:[...selectedTags],notes:val('notes'),o2device:val('o2device')};['sys','dia','map','hr','spo2','rr','temp','o2flow','norad','noradml','adrenaline','adrenalineml','ivIn','enteralIn','urineOut','lactate','ph','hco3','hb','creatinine','troponin','sodium','potassium'].forEach(k=>{const x=n(val(k));if(x!=null)e[k]=x});if(e.map==null&&e.sys!=null&&e.dia!=null)e.map=Math.round((e.sys+2*e.dia)/3);db.entries.push(e);save();selectedTags=[];view='dash';render()};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this entry?')){db.entries=db.entries.filter(e=>String(e.id)!==b.dataset.del);save();render()}});if($('#familyPdf'))$('#familyPdf').onclick=makeFamilyPDF;if($('#exportJson'))$('#exportJson').onclick=()=>dl('critical-care-log-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json');if($('#exportCsv'))$('#exportCsv').onclick=()=>{const ks=['ts','sys','dia','map','hr','spo2','rr','temp','o2device','o2flow','norad','noradml','adrenaline','adrenalineml','ivIn','enteralIn','urineOut','lactate','ph','hco3','hb','creatinine','troponin','sodium','potassium','tags','notes'];const rows=[ks.join(','),...db.entries.map(e=>ks.map(k=>'"'+String(k==='tags'?(e.tags||[]).join('|'):(e[k]??'')).replaceAll('"','""')+'"').join(','))];dl('critical-care-log.csv',rows.join('\n'),'text/csv')};if($('#importFile'))$('#importFile').onchange=async ev=>{try{const j=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(j.entries))throw 0;db=j;save();alert('Backup imported');render()}catch{alert('Invalid backup file')}};if($('#clearAll'))$('#clearAll').onclick=()=>{if(confirm('Delete every saved entry from this phone?')){db={entries:[]};save();render()}}}function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function makeFamilyPDF(){const st=$('#pdfStatus');try{if(!window.jspdf)throw Error('PDF library is not loaded. Check internet and reopen the app.');const es=[...db.entries].sort((a,b)=>new Date(a.ts)-new Date(b.ts));if(!es.length)throw Error('No entries to export.');const has=v=>v!==null&&v!==undefined&&v!=='';const last=k=>{for(let i=es.length-1;i>=0;i--)if(has(es[i][k]))return{v:es[i][k],ts:es[i].ts};return null};const tm=ts=>ts?new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—',dt=ts=>ts?new Date(ts).toLocaleString([],{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';const C={ink:[24,30,36],muted:[100,110,120],line:[220,225,230],blue:[43,108,176],red:[180,66,66],green:[45,125,83],amber:[170,115,30],purple:[105,74,150],soft:[247,248,249],white:[255,255,255]};const{jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),M=15,W=210,CW=180;let y=14,page=1;function t(s,x,yy,sz=9,b=false,col=C.ink,max=CW){d.setFont('helvetica',b?'bold':'normal');d.setFontSize(sz);d.setTextColor(...col);const ls=d.splitTextToSize(String(s),max);d.text(ls,x,yy);return ls.length*sz*.37}function rule(yy){d.setDrawColor(...C.line);d.line(M,yy,W-M,yy)}function footer(){rule(285);t('Family-maintained log · Not an official hospital medical record · Confirm with the treating team',M,290,6.5,false,C.muted,155);t(String(page),188,290,7,true,C.muted)}function np(){footer();d.addPage();page++;y=15;t('Detailed Medical Log',M,y,18,true);y+=10}function ensure(h){if(y+h>278)np()}function heading(s){ensure(14);t(s.toUpperCase(),M,y,8,true,C.muted);y+=4;rule(y);y+=7}function metric(x,yy,w,label,value,time,accent){d.setFillColor(...C.white);d.setDrawColor(...C.line);d.roundedRect(x,yy,w,31,2,2,'FD');d.setFillColor(...accent);d.rect(x,yy,w,1.3,'F');t(label,x+4,yy+7,7,true,C.muted,w-8);t(value,x+4,yy+17,16,true,C.ink,w-8);t(tm(time),x+4,yy+24,7.5,true,accent,w-8)}function lc(x,yy,w,label,k,unit,accent){const o=last(k);metric(x,yy,w,label,o?o.v+(unit||''):'—',o&&o.ts,accent)}const latest=es[es.length-1];t('CRITICAL CARE FAMILY REPORT',M,y,8,true,C.blue);y+=8;t('Current status',M,y,22,true);t(dt(latest.ts),145,y,8,true,C.muted,50);y+=7;t('Latest information recorded by the family.',M,y,8,false,C.muted);y+=10;heading('How is he now?');const s=last('sys'),di=last('dia'),bp=(s||di)?(s?s.v:'—')+'/'+(di?di.v:'—'):'—';metric(M,y,56,'BLOOD PRESSURE',bp,(s||di)&&((s||di).ts),C.red);lc(M+62,y,56,'OXYGEN','spo2','%',C.blue);lc(M+124,y,56,'HEART RATE','hr',' bpm',C.green);y+=39;heading('Important latest results');lc(M,y,56,'BLOOD LEVEL · Hb','hb',' g/dL',C.red);lc(M+62,y,56,'POTASSIUM','potassium',' mmol/L',C.amber);lc(M+124,y,56,'BLOOD ACIDITY · pH','ph','',C.blue);y+=39;heading('Current treatment / support');let rows=[];const od=last('o2device'),of=last('o2flow'),ad=last('adrenaline'),adm=last('adrenalineml'),nd=last('norad'),ndm=last('noradml');if(od||of)rows.push(['Oxygen',((od&&od.v)||'Oxygen')+(of?' · '+of.v+' L/min':''),(of||od).ts,C.blue]);if(ad)rows.push(['Blood-pressure medicine','Adrenaline '+ad.v+' ug/kg/min'+(adm?' · pump '+adm.v+' mL/hr':''),ad.ts,C.red]);if(nd)rows.push(['Blood-pressure medicine','Noradrenaline '+nd.v+' ug/kg/min'+(ndm?' · pump '+ndm.v+' mL/hr':''),nd.ts,C.red]);const all=es.map(e=>((e.tags||[]).join(' ')+' '+(e.notes||'')).toLowerCase()).join(' ');if(all.includes('transfus'))rows.push(['Blood transfusion','Recorded in family notes','',C.purple]);if(all.includes('potassium')&&(all.includes('calcium')||all.includes('bicarbonate')||all.includes('nebul')))rows.push(['High-potassium treatment','Recorded in family notes','',C.amber]);if(!rows.length){t('No treatment/support details recorded.',M,y,9,false,C.muted);y+=9}else for(const r of rows.slice(0,5)){ensure(13);d.setFillColor(...r[3]);d.circle(M+2,y+4,1.2,'F');t(r[0],M+7,y+5,9,true,C.ink,48);t(r[1],M+58,y+5,8.5,false,C.ink,92);if(r[2])t(tm(r[2]),176,y+5,7.5,true,r[3],18);y+=11}heading('Recent timeline');d.setFillColor(...C.soft);d.rect(M,y,CW,8,'F');t('TIME',M+3,y+5.5,7,true,C.muted);t('BP',M+32,y+5.5,7,true,C.muted);t('OXYGEN',M+62,y+5.5,7,true,C.muted);t('HR',M+94,y+5.5,7,true,C.muted);t('EVENT / NOTE',M+116,y+5.5,7,true,C.muted);y+=9;for(const e of es.slice(-8).reverse()){ensure(13);const bpv=(has(e.sys)||has(e.dia))?(has(e.sys)?e.sys:'—')+'/'+(has(e.dia)?e.dia:'—'):'—',ox=has(e.spo2)?e.spo2+'%':'—',hr=has(e.hr)?e.hr:'—';let ev='';if(e.tags&&e.tags.length)ev=e.tags.join(', ');if(e.notes)ev+=(ev?' · ':'')+e.notes;rule(y);t(tm(e.ts),M+3,y+6,8,true,C.purple,25);t(bpv,M+32,y+6,8,true,C.ink,27);t(ox,M+62,y+6,8,true,C.ink,28);t(hr,M+94,y+6,8,true,C.ink,18);t(ev||'—',M+116,y+5,7.2,false,C.ink,62);y+=12}footer();d.addPage();page++;y=15;t('Detailed Medical Log',M,y,18,true);y+=6;t('Exact information as entered in the family log',M,y,8,false,C.muted);y+=9;for(const e of es){let a=[];if(has(e.sys)||has(e.dia))a.push('BP '+(has(e.sys)?e.sys:'—')+'/'+(has(e.dia)?e.dia:'—'));[['map','MAP'],['hr','HR'],['spo2','SpO2 %'],['rr','RR'],['temp','Temp C'],['o2device','O2 device'],['o2flow','O2 L/min'],['norad','Noradrenaline'],['noradml','Norad pump mL/hr'],['adrenaline','Adrenaline'],['adrenalineml','Adrenaline pump mL/hr'],['potassium','Potassium'],['ph','pH'],['hb','Hb'],['lactate','Lactate'],['hco3','HCO3'],['creatinine','Creatinine'],['ivIn','IV input mL'],['enteralIn','Feed/input mL'],['urineOut','Urine mL']].forEach(([k,l])=>{if(has(e[k]))a.push(l+' '+e[k])});if(e.tags&&e.tags.length)a.push('Events: '+e.tags.join(', '));if(e.notes)a.push('Note: '+e.notes);const body=a.join(' · ')||'Entry saved',lines=d.splitTextToSize(body,142),h=Math.max(14,lines.length*4+6);ensure(h);t(dt(e.ts),M,y+5,8,true,C.purple,32);t(body,M+36,y+5,8,false,C.ink,142);y+=h;rule(y-3)}footer();const blob=d.output('blob'),name='Critical-Care-Family-Report-'+new Date().toISOString().slice(0,10)+'.pdf',file=new File([blob],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){if(st)st.textContent='PDF created. Opening share sheet...';await navigator.share({files:[file],title:'Critical Care Family Report'});if(st)st.textContent='PDF created successfully.'}else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();if(st)st.textContent='PDF created.'}}catch(e){if(st)st.textContent='Could not create PDF: '+e.message;else alert(e.message)}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
