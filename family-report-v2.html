<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Critical Care Family Report</title><style>*{box-sizing:border-box;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}body{margin:0;background:#e9eef2;color:#17212b;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial}.page{max-width:900px;margin:auto;background:#fff;min-height:100vh;padding:20px}h1{margin:0;font-size:25px}.sub{color:#64727d;font-size:12px;margin:5px 0 15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.box{border-radius:13px;padding:12px;min-height:98px}.vital{background:#dceeff}.lab{background:#fff0c9}.blood{background:#ffe0e0}.box small{font-size:10px;font-weight:800;text-transform:uppercase}.box strong{display:block;font-size:23px;margin:7px 0}.box span{font-size:10px;color:#52616b}.event{display:grid;grid-template-columns:100px 1fr;gap:10px;border-top:1px solid #ddd;padding:11px 0;break-inside:avoid}.time{background:#3978b2;color:#fff;border-radius:8px;padding:7px;text-align:center;font-weight:800;height:max-content}.pill{display:inline-block;padding:5px 7px;border-radius:7px;margin:2px;font-size:11px}.pv{background:#dceeff}.pl{background:#fff0c9}.pb{background:#ffe0e0}.pt{background:#e7f3e8}.print{background:#263746;color:#fff;border:0;border-radius:9px;padding:11px 14px;font-weight:700;float:right}h2{margin-top:22px;font-size:17px}.foot{margin-top:20px;border-top:1px solid #ccc;padding-top:8px;font-size:9px;color:#777}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.event{grid-template-columns:78px 1fr}.page{padding:14px}}@media print{body{background:#fff}.print{display:none}.page{max-width:none;padding:10mm}}</style></head><body><div class="page"><button class="print" onclick="window.print()">Print / Save PDF</button><h1>Critical Care Family Report</h1><div class="sub" id="gen"></div><h2>Latest readings</h2><div class="grid" id="latest"></div><h2>Timeline</h2><div id="timeline"></div><div class="foot">Family-maintained log. Not an official hospital medical record. Confirm values and treatments with the treating team.</div></div><script>const K='critical-care-log-v1';let d;try{d=JSON.parse(localStorage.getItem(K))||{entries:[]}}catch{d={entries:[]}}const a=[...(d.entries||[])].sort((x,y)=>new Date(x.ts)-new Date(y.ts)),E=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),F=t=>new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});function L(k){for(let i=a.length-1;i>=0;i--)if(a[i][k]!=null&&a[i][k]!=='')return{v:a[i][k],t:a[i].ts,e:a[i]};return null}const ds=[['sys','Blood pressure','mmHg','vital'],['spo2','Oxygen level','%','vital'],['hr','Heart rate','bpm','vital'],['hb','Hemoglobin','g/dL','blood'],['potassium','Potassium','mmol/L','lab'],['ph','Blood pH','','lab'],['lactate','Lactate','mmol/L','lab'],['hco3','Bicarbonate','mmol/L','lab'],['creatinine','Creatinine','µmol/L','lab']];document.querySelector('#gen').textContent='Generated '+new Date().toLocaleString()+' · '+a.length+' entries';document.querySelector('#latest').innerHTML=ds.map(([k,l,u,c])=>{let x=L(k),v='—';if(x)v=k==='sys'&&x.e.dia!=null?x.v+'/'+x.e.dia:x.v;return `<div class="box ${c}"><small>${l}</small><strong>${E(v)} ${x?u:''}</strong><span>${x?'Recorded '+F(x.t):'Not recorded'}</span></div>`}).join('');function P(s,c){return s?`<span class="pill ${c}">${s}</span>`:''}function V(e,k,l,u='',c='pv'){return e[k]!=null&&e[k]!==''?P(`${l}: <b>${E(e[k])}${u}</b>`,c):''}document.querySelector('#timeline').innerHTML=a.length?a.slice().reverse().map(e=>{let s=(e.sys!=null||e.dia!=null?P(`BP: <b>${E(e.sys??'—')}/${E(e.dia??'—')}</b>`,'pv'):'')+V(e,'hr','HR',' bpm')+V(e,'spo2','Oxygen','%')+V(e,'hb','Hb',' g/dL','pb')+V(e,'potassium','K',' mmol/L','pl')+V(e,'ph','pH','','pl')+V(e,'lactate','Lactate','','pl');if(e.transfusion)s+=P('Blood: '+E(e.transfusion),'pb');if(e.bleeding)s+=P('GI/NG: '+E(e.bleeding),'pb');(e.quickTreatments||[]).forEach(x=>s+=P(E(x),'pt'));let n=[e.treatments,e.notes].filter(Boolean).map(E).join(' · ');return `<div class="event"><div class="time">${F(e.ts)}</div><div>${s}${n?'<div style="margin-top:6px">'+n+'</div>':''}</div></div>`}).join(''):'No saved entries found.';</script></body></html>
