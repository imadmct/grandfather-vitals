<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1114"><title>Critical Care Log V2</title><style>:root{--b:#0d1114;--p:#161d22;--p2:#1d262c;--l:#303b43;--t:#f5f7f8;--m:#9eabb4;--blue:#72b8ff;--green:#70d49a;--amber:#f1c96c;--red:#ff8078}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}.w{max-width:700px;margin:auto;padding:14px}h1{font-size:22px;margin:8px 0 2px}.sub,.muted{color:var(--m);font-size:12px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;margin:12px 0;overflow:hidden}.hd{padding:11px 13px;border-bottom:1px solid var(--l);color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.07em}.bd{padding:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.f label{display:block;color:var(--m);font-size:10px;margin:0 0 5px 2px}.f input,.f select,.f textarea{width:100%;background:var(--p2);border:1px solid var(--l);border-radius:10px;color:var(--t);padding:11px;font-size:16px}.f textarea{min-height:72px}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:700;background:#e8f3ff;color:#09131b}.btn2{background:var(--p2);color:var(--t);border:1px solid var(--l)}.danger{color:var(--red)}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--l)}.metric{background:var(--p);padding:11px;min-height:82px}.metric small{display:block;color:var(--m);font-size:9px;text-transform:uppercase}.metric b{display:block;font-size:22px;margin-top:4px}.metric em{font-style:normal;color:var(--m);font-size:9px}.item{padding:12px;border-bottom:1px solid var(--l)}.time{color:var(--blue);font-weight:700;font-size:12px}.vals{margin-top:6px;line-height:1.65}.tag{display:inline-block;padding:4px 7px;margin:5px 4px 0 0;border-radius:999px;background:#243039;font-size:10px}.chip{border:1px solid var(--l);background:var(--p2);color:var(--m);padding:8px;border-radius:999px}.chip.on{background:#ddecff;color:#08131b}.note{color:#ccd5da;margin-top:6px}.warn{border-left:4px solid var(--amber);padding-left:9px}nav{position:fixed;bottom:0;left:0;right:0;background:#10161aeF;border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}nav div{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}nav button{background:none;border:0;color:var(--m);padding:14px 3px;font-weight:700}.active{color:var(--blue)!important}@media(max-width:420px){.metrics,.grid3{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="w"><h1>Critical Care Log <span class="muted">V2 Preview</span></h1><div class="sub">Private entries stored on this phone. Family log, not a hospital record.</div><main id="app"></main></div><nav><div><button data-v="now" class="active">Now</button><button data-v="add">Add</button><button data-v="timeline">Timeline</button><button data-v="data">Data</button></div></nav><script>const KEY='critical-care-log-v1';let db=load(),view='now',editId=null,tags=[];function load(){try{return JSON.parse(localStorage.getItem(KEY))||{entries:[]}}catch(e){return{entries:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(t){return new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}function localNow(){let d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}function sorted(){return [...db.entries].sort((a,b)=>new Date(b.ts)-new Date(a.ts))}function latest(k){for(const e of sorted())if(e[k]!==null&&e[k]!==undefined&&e[k]!=='')return{v:e[k],t:e.ts};return null}function metric(label,k,unit=''){let x=latest(k);return `<div class="metric"><small>${label}</small><b>${x?esc(x.v):'–'} ${x&&unit?`<span style="font-size:10px">${unit}</span>`:''}</b><em>${x?fmt(x.t):'No entry'}</em></div>`}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===view));$('#app').innerHTML=view==='now'?now():view==='add'?add():view==='timeline'?timeline():data();bind()}function now(){return `<div class="card"><div class="hd">Latest vital values · each keeps its own time</div><div class="metrics">${metric('Systolic','sys','mmHg')}${metric('Diastolic','dia','mmHg')}${metric('MAP','map','mmHg')}${metric('Heart rate','hr','bpm')}${metric('Oxygen','spo2','%')}${metric('Resp rate','rr','/min')}</div></div><div class="card"><div class="hd">Latest important labs</div><div class="metrics">${metric('Hemoglobin','hb','g/dL')}${metric('Potassium','potassium','mmol/L')}${metric('pH','ph')}${metric('Lactate','lactate','mmol/L')}${metric('Bicarbonate','hco3','mmol/L')}${metric('Creatinine','creatinine','µmol/L')}</div></div><div class="card"><div class="hd">Current support / recent events</div><div class="bd">${recentSupport()}</div></div>`}function recentSupport(){let e=sorted().find(x=>x.adrenaline||x.norad||x.o2device||x.transfusion||x.bleeding||x.treatments);if(!e)return '<span class="muted">No support/event entry yet.</span>';let a=[];if(e.o2device)a.push('Oxygen: '+e.o2device+(e.o2flow?' · '+e.o2flow+' L/min':''));if(e.adrenaline)a.push('Adrenaline: '+e.adrenaline+' µg/kg/min');if(e.norad)a.push('Noradrenaline: '+e.norad+' µg/kg/min');if(e.transfusion)a.push('Blood: '+e.transfusion);if(e.bleeding)a.push('GI/NG: '+e.bleeding);if(e.treatments)a.push('Treatment: '+e.treatments);return `<b>${fmt(e.ts)}</b><br>${a.map(esc).join('<br>')}`}
function f(id,l,type='number',step='any'){return `<div class="f"><label>${l}</label><input id="${id}" type="${type}" ${type==='number'?`step="${step}" inputmode="decimal"`:''}></div>`}function add(){let e=editId?db.entries.find(x=>x.id===editId):null;setTimeout(()=>fill(e),0);return `<div class="card"><div class="hd">${e?'Edit saved entry':'New timestamped entry'}</div><div class="bd"><div class="f"><label>Time</label><input id="ts" type="datetime-local" value="${e?e.ts:localNow()}"></div></div></div><div class="card"><div class="hd">Vitals</div><div class="bd grid3">${f('sys','Systolic BP')}${f('dia','Diastolic BP')}${f('map','MAP')}${f('hr','Heart rate')}${f('spo2','SpO₂')}${f('rr','Resp rate')}</div></div><div class="card"><div class="hd">Labs</div><div class="bd grid3">${f('hb','Hemoglobin g/dL','number','0.1')}${f('potassium','Potassium mmol/L','number','0.01')}${f('ph','pH','number','0.01')}${f('lactate','Lactate mmol/L','number','0.01')}${f('hco3','Bicarbonate mmol/L','number','0.1')}${f('creatinine','Creatinine µmol/L')}</div></div><div class="card"><div class="hd">Oxygen & blood pressure support</div><div class="bd grid"><div class="f"><label>Oxygen device</label><select id="o2device"><option value="">Not entered</option><option>Simple mask</option><option>Non-rebreather mask</option><option>Nasal cannula</option><option>High-flow nasal oxygen</option><option>NIV / BiPAP</option><option>Ventilator</option></select></div>${f('o2flow','O₂ flow L/min')}${f('adrenaline','Adrenaline µg/kg/min','number','0.01')}${f('adrenalineml','Adrenaline pump mL/hr','number','0.1')}${f('norad','Noradrenaline µg/kg/min','number','0.01')}${f('noradml','Norad pump mL/hr','number','0.1')}</div></div><div class="card"><div class="hd">Blood transfusion & GI bleeding</div><div class="bd grid"><div class="f"><label>Transfusion</label><select id="transfusion"><option value="">Not entered</option><option>Unit 1 started</option><option>Unit 1 completed</option><option>Unit 2 started</option><option>Unit 2 completed</option><option>Unit 3 started</option><option>Unit 3 completed</option><option>Other transfusion event</option></select></div><div class="f"><label>GI / NG bleeding</label><select id="bleeding"><option value="">Not entered</option><option>Blood seen from NG tube</option><option>Coffee-ground NG drainage</option><option>Fresh red blood</option><option>Black/tarry stool</option><option>Bleeding suspected</option><option>Bleeding confirmed by team</option></select></div>${f('ngamount','NG/drain amount mL')}</div></div><div class="card"><div class="hd">Treatments</div><div class="bd"><div class="row" id="chips">${['Nebulizer','Calcium gluconate','Sodium bicarbonate','Insulin + glucose','IV fluids','Suction','Ultrasound','ABG collected','CBC collected','U&E collected'].map(x=>`<button type="button" class="chip" data-tag="${x}">${x}</button>`).join('')}</div><div class="f" style="margin-top:10px"><label>Other treatment / event</label><input id="treatments" type="text"></div><div class="f" style="margin-top:10px"><label>Notes</label><textarea id="notes"></textarea></div><button id="saveEntry" class="btn" style="width:100%;margin-top:10px">${e?'Save changes':'Save entry'}</button>${e?'<button id="cancelEdit" class="btn btn2" style="width:100%;margin-top:8px">Cancel edit</button>':''}</div></div>`}function fill(e){if(!e)return;for(const[k,v]of Object.entries(e)){let el=$('#'+k);if(el&&typeof v!=='object')el.value=v??''}tags=e.quickTreatments||[];document.querySelectorAll('[data-tag]').forEach(b=>b.classList.toggle('on',tags.includes(b.dataset.tag)))}function timeline(){let a=sorted();return `<div class="card">${a.length?a.map(e=>{let vs=[];[['sys','Sys'],['dia','Dia'],['map','MAP'],['hr','HR'],['spo2','SpO₂'],['rr','RR'],['hb','Hb'],['potassium','K'],['ph','pH'],['lactate','Lactate']].forEach(([k,l])=>{if(e[k]!==undefined&&e[k]!==null&&e[k]!=='')vs.push(`<b>${l}</b> ${esc(e[k])}`)});return `<div class="item"><div class="time">${fmt(e.ts)}</div><div class="vals">${vs.join(' · ')}</div>${e.transfusion?`<span class="tag">🩸 ${esc(e.transfusion)}</span>`:''}${e.bleeding?`<span class="tag">GI/NG: ${esc(e.bleeding)}</span>`:''}${(e.quickTreatments||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}${e.treatments?`<div class="note">Treatment: ${esc(e.treatments)}</div>`:''}${e.notes?`<div class="note">${esc(e.notes)}</div>`:''}<div class="row" style="margin-top:8px"><button class="chip" data-edit="${e.id}">Edit</button><button class="chip danger" data-del="${e.id}">Delete</button></div></div>`}).join(''):'<div class="bd muted">No entries.</div>'}</div>`}function data(){return `<div class="card"><div class="hd">Family report</div><div class="bd"><div class="warn muted">V2 report uses plain-language labels and shows the timestamp beside each important result.</div><button id="family" class="btn" style="width:100%;margin-top:12px">Open family report / Print PDF</button></div></div><div class="card"><div class="hd">Backup</div><div class="bd"><button id="backup" class="btn btn2" style="width:100%">Export JSON backup</button></div></div>`}function gv(id){let e=$('#'+id);return e?e.value:''}function bind(){document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;editId=null;tags=[];render()});document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');tags=b.classList.contains('on')?[...new Set([...tags,b.dataset.tag])]:tags.filter(x=>x!==b.dataset.tag)});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;view='add';render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this entry?')){db.entries=db.entries.filter(x=>String(x.id)!==String(b.dataset.del));save();render()}});if($('#cancelEdit'))$('#cancelEdit').onclick=()=>{editId=null;view='timeline';render()};if($('#saveEntry'))$('#saveEntry').onclick=()=>{let old=editId?db.entries.find(x=>x.id===editId):{};let e={...old,id:editId||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())),ts:gv('ts'),quickTreatments:[...tags]};['sys','dia','map','hr','spo2','rr','hb','potassium','ph','lactate','hco3','creatinine','o2flow','adrenaline','adrenalineml','norad','noradml','ngamount'].forEach(k=>{let v=gv(k);e[k]=v===''?null:Number(v)});['o2device','transfusion','bleeding','treatments','notes'].forEach(k=>e[k]=gv(k));if(!e.map&&e.sys&&e.dia)e.map=Math.round((e.sys+2*e.dia)/3);if(editId)db.entries=db.entries.map(x=>x.id===editId?e:x);else db.entries.push(e);save();editId=null;tags=[];view='timeline';render()};if($('#backup'))$('#backup').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='critical-care-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};if($('#family'))$('#family').onclick=familyReport}function familyReport(){let a=sorted(),w=window.open('','_blank');let lab=(label,k,unit='')=>{let x=latest(k);return `<div class="box"><small>${label}</small><strong>${x?esc(x.v):'—'} ${unit}</strong><span>${x?fmt(x.t):'Not recorded'}</span></div>`};let rows=a.map(e=>`<tr><td>${fmt(e.ts)}</td><td>${e.sys||e.dia?`BP ${e.sys??'—'}/${e.dia??'—'}; `:''}${e.spo2!=null?`Oxygen ${e.spo2}%; `:''}${e.hb!=null?`Hemoglobin ${e.hb}; `:''}${e.potassium!=null?`Potassium ${e.potassium}; `:''}${e.ph!=null?`pH ${e.ph}; `:''}${esc(e.transfusion||'')} ${esc(e.bleeding||'')} ${esc(e.notes||'')}</td></tr>`).join('');w.document.write(`<!doctype html><meta name="viewport" content="width=device-width"><title>Critical Care Family Report</title><style>body{font:14px Arial;margin:24px;color:#172027}h1{margin-bottom:3px}.sub{color:#66737b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.box{border:1px solid #ccd4d8;border-radius:10px;padding:10px}.box small,.box span{display:block;color:#66737b;font-size:10px}.box strong{display:block;font-size:20px;margin:3px 0}.blue{border-top:5px solid #4a90d9}.red{border-top:5px solid #d96860}.amber{border-top:5px solid #d5a43b}table{width:100%;border-collapse:collapse}td{border-bottom:1px solid #ddd;padding:9px 5px;vertical-align:top}td:first-child{width:120px;font-weight:bold}button{padding:8px 12px;margin-bottom:10px}@media print{button{display:none}}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}</style><button onclick="print()">Print / Save PDF</button><h1>Critical Care Family Report</h1><div class="sub">Family-maintained log. Values should be confirmed with the treating team.</div><h2>Latest important readings</h2><div class="grid">${lab('Blood pressure','sys','mmHg systolic')}${lab('Oxygen level','spo2','%')}${lab('Hemoglobin (blood level)','hb','g/dL')}${lab('Potassium','potassium','mmol/L')}${lab('Blood acidity (pH)','ph')}${lab('Lactate','lactate','mmol/L')}</div><h2>Timeline</h2><table>${rows}</table>`);w.document.close()}render();</script></body></html>
