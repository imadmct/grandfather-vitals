<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Family PDF Export Test</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0b1014;color:#f4f7f9;margin:0;padding:24px}.wrap{max-width:600px;margin:auto}h1{font-size:26px}.muted{color:#9eabb5;line-height:1.5}.btn{width:100%;border:0;border-radius:14px;padding:16px;margin-top:14px;font-size:17px;font-weight:700;background:#66b7ff;color:#071018}.status{margin-top:18px;padding:14px;border:1px solid #26333d;border-radius:12px;line-height:1.5}</style></head><body><div class="wrap"><h1>Family PDF Export Test</h1><p class="muted">Colorful family summary first, detailed medical log afterward. The PDF is generated locally from entries on this phone.</p><button class="btn" onclick="makePDF()">Generate & Share Family PDF</button><div class="status" id="status">Ready.</div></div><script>const K='critical-care-log-v1',C={navy:[25,43,61],blue:[225,240,252],blueA:[32,104,163],green:[228,244,235],greenA:[37,112,73],amber:[255,244,218],amberA:[154,100,20],purple:[240,233,250],purpleA:[105,65,145],rose:[251,232,235],roseA:[150,62,73],gray:[242,245,247],grayA:[86,99,110],white:[255,255,255]};const val=(x,f='Not recorded')=>x===null||x===undefined||x===''?f:String(x);function entries(){try{return (JSON.parse(localStorage.getItem(K))||{}).entries||[]}catch{return[]}}function lastObj(es,k){for(let i=es.length-1;i>=0;i--)if(es[i][k]!==null&&es[i][k]!==undefined&&es[i][k]!=='')return {v:es[i][k],ts:es[i].ts};return null}function total(es,k){return es.reduce((s,e)=>s+(Number(e[k])||0),0)}function fmt(ts,short=false){if(!ts)return'Not recorded';return new Date(ts).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',...(short?{}:{year:'numeric'})})}async function makePDF(){const st=document.getElementById('status');try{if(!window.jspdf)throw Error('PDF library did not load.');const es=entries().sort((a,b)=>new Date(a.ts)-new Date(b.ts));if(!es.length)throw Error('No entries found in this browser storage.');const latest=es[es.length-1],{jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),W=210,M=14,CW=182;let y=15,page=1;function txt(t,x,y0,size=9,bold=false,col=C.navy,max=CW){d.setFont('helvetica',bold?'bold':'normal');d.setFontSize(size);d.setTextColor(...col);let ls=d.splitTextToSize(String(t),max);d.text(ls,x,y0);return ls.length*(size*.38)}function footer(){d.setDrawColor(220);d.line(M,286,W-M,286);txt('Family-maintained log. Not an official hospital medical record. Verify values with the treating team.',M,290,6.8,false,C.grayA,155);txt('Page '+page,W-M,290,7,true,C.grayA,20)}function newPage(title='Detailed Medical Log'){footer();d.addPage();page++;y=16;txt(title,M,y,17,true,C.navy);y+=9}function ensure(h){if(y+h>280)newPage()}function section(t,sub=''){ensure(15);y+=3;txt(t,M,y,13,true,C.navy);y+=6;if(sub){y+=txt(sub,M,y,8,false,C.grayA)+2}}function card(x,yy,w,h,label,value,time,explain,bg,accent){d.setFillColor(...bg);d.roundedRect(x,yy,w,h,3,3,'F');txt(label,x+4,yy+6,7.5,true,accent,w-8);txt(value,x+4,yy+14,15,true,C.navy,w-8);if(time)txt('Recorded '+fmt(time,true),x+4,yy+20,6.8,true,C.grayA,w-8);if(explain)txt(explain,x+4,yy+26,7,false,C.grayA,w-8)}function latestCard(label,k,unit,explain,bg,accent,x,yy,w=57){const o=lastObj(es,k);card(x,yy,w,36,label,o?o.v+(unit?' '+unit:''):'Not recorded',o&&o.ts,explain,bg,accent)}function rowTime(e,body,bg=C.gray){ensure(18);d.setFillColor(...bg);d.roundedRect(M,y,CW,15,2,2,'F');txt(fmt(e.ts,true),M+4,y+6,8.5,true,C.blueA,28);txt(body,M+34,y+5,8,false,C.navy,CW-38);y+=18}txt('FAMILY CARE UPDATE',M,y,8,true,C.blueA);y+=7;txt('Current situation at a glance',M,y,21,true,C.navy);y+=8;txt('Latest family entry: '+fmt(latest.ts),M,y,8.5,false,C.grayA);y+=5;txt('Generated: '+new Date().toLocaleString(),M,y,7.5,false,C.grayA);y+=9;let bp=latest.sys!=null||latest.dia!=null?val(latest.sys,'-')+'/'+val(latest.dia,'-')+' mmHg':'Not recorded';card(M,y,57,36,'BLOOD PRESSURE',bp,latest.ts,'Pressure of blood in the circulation.',C.blue,C.blueA);latestCard('OXYGEN LEVEL','spo2','%','Oxygen saturation reading.',C.green,C.greenA,M+62,y);latestCard('HEART RATE','hr','bpm','Number of heart beats each minute.',C.purple,C.purpleA,M+124,y);y+=42;latestCard('HEMOGLOBIN / BLOOD LEVEL','hb','g/dL','Carries oxygen in the blood.',C.rose,C.roseA,M,y);latestCard('POTASSIUM','potassium','mmol/L','Blood salt important for heart and muscles.',C.amber,C.amberA,M+62,y);latestCard('BLOOD ACIDITY (pH)','ph','','Measures how acidic or alkaline the blood is.',C.blue,C.blueA,M+124,y);y+=43;section('What support is recorded now','These statements only describe information entered into the family log.');let sup=[];const od=lastObj(es,'o2device'),of=lastObj(es,'o2flow'),ad=lastObj(es,'adrenaline'),nd=lastObj(es,'norad');if(od||of)sup.push(['Oxygen support',(od?od.v:'Oxygen')+(of?' at '+of.v+' L/min':''),'Helps deliver additional oxygen.',C.green,C.greenA,(of||od).ts]);if(ad)sup.push(['Adrenaline infusion',ad.v+' ug/kg/min'+(lastObj(es,'adrenalineml')?' | pump '+lastObj(es,'adrenalineml').v+' mL/hr':''),'IV medicine recorded for blood-pressure/circulation support.',C.purple,C.purpleA,ad.ts]);if(nd)sup.push(['Noradrenaline infusion',nd.v+' ug/kg/min'+(lastObj(es,'noradml')?' | pump '+lastObj(es,'noradml').v+' mL/hr':''),'IV medicine recorded for blood-pressure/circulation support.',C.purple,C.purpleA,nd.ts]);if(!sup.length){txt('No current support details recorded.',M,y,9,false,C.grayA);y+=7}else for(const s of sup){ensure(20);d.setFillColor(...s[3]);d.roundedRect(M,y,CW,17,2,2,'F');txt(s[0],M+4,y+6,9,true,s[4],45);txt(s[1],M+50,y+6,9,true,C.navy,65);txt(s[2],M+118,y+5,7,false,C.grayA,60);txt(fmt(s[5],true),M+50,y+12,6.5,false,C.grayA,60);y+=20}section('Recorded fluid balance');let input=total(es,'ivIn')+total(es,'enteralIn'),urine=total(es,'urineOut'),net=input-urine;card(M,y,57,25,'INPUT',input+' mL',null,'Recorded IV + feed/input.',C.blue,C.blueA);card(M+62,y,57,25,'URINE OUTPUT',urine+' mL',null,'Recorded urine output.',C.amber,C.amberA);card(M+124,y,57,25,'NET BALANCE',(net>=0?'+':'')+net+' mL',null,'Recorded input minus urine.',C.gray,C.grayA);y+=31;txt('Fluid totals include only entries saved in this family log and may not match the hospital chart.',M,y,7,false,C.grayA);y+=8;section('Recent important events','Time is highlighted so family members can quickly follow what happened and when.');let ev=es.filter(e=>(e.tags&&e.tags.length)||e.notes).slice(-7).reverse();if(!ev.length){txt('No event notes recorded.',M,y,9,false,C.grayA);y+=7}else for(const e of ev){let body=((e.tags&&e.tags.length)?e.tags.join(' | ')+' - ':'')+(e.notes||'');rowTime(e,body,C.gray)}newPage('Detailed Medical Log');txt('Exact recorded values and notes',M,y,9,false,C.grayA);y+=8;for(const e of es){let a=[];if(e.sys!=null||e.dia!=null)a.push('BP '+val(e.sys,'-')+'/'+val(e.dia,'-'));[['map','MAP'],['hr','HR'],['spo2','SpO2 %'],['rr','RR'],['temp','Temp C'],['o2flow','O2 L/min'],['norad','Norad'],['adrenaline','Adrenaline'],['potassium','Potassium'],['ph','pH'],['hb','Hb'],['lactate','Lactate'],['hco3','HCO3'],['creatinine','Creatinine'],['ivIn','IV input mL'],['enteralIn','Feed/input mL'],['urineOut','Urine mL']].forEach(([k,l])=>{if(e[k]!=null&&e[k]!=='')a.push(l+' '+e[k])});let body=a.join(' | ');if(e.notes)body+=(body?'\n':'')+'Note: '+e.notes;rowTime(e,body,C.white)}footer();const blob=d.output('blob'),name='Family-Care-Update-'+new Date().toISOString().slice(0,10)+'.pdf',file=new File([blob],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){st.textContent='PDF created. Opening iPhone share sheet...';await navigator.share({files:[file],title:'Family Care Update'});st.textContent='PDF created successfully.'}else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.textContent='Tap here to open/download the generated PDF';a.style='display:block;margin-top:12px;color:#66b7ff;font-weight:700';st.innerHTML='PDF created. Direct file sharing is not available in this browser.';st.appendChild(a)}}catch(e){st.textContent='Could not create PDF: '+e.message}}</script></body></html>
