<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Family Report PDF Test v4</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0b1014;color:#f4f7f9;margin:0;padding:24px}.wrap{max-width:600px;margin:auto}.tag{font-size:12px;color:#66b7ff;font-weight:700}h1{font-size:26px;margin:7px 0}.muted{color:#9eabb5;line-height:1.5}.btn{width:100%;border:0;border-radius:14px;padding:16px;margin-top:14px;font-size:17px;font-weight:700;background:#66b7ff;color:#071018}.status{margin-top:18px;padding:14px;border:1px solid #26333d;border-radius:12px;line-height:1.5}</style></head><body><div class="wrap"><div class="tag">DESIGN V4</div><h1>Clean Family Report</h1><p class="muted">Hospital-style layout. White background, restrained category colors, large numbers and clear timestamps.</p><button class="btn" onclick="makePDF()">Generate & Share V4 PDF</button><div class="status" id="status">Ready.</div></div><script>const K='critical-care-log-v1',C={ink:[24,30,36],muted:[100,110,120],line:[220,225,230],blue:[43,108,176],red:[180,66,66],green:[45,125,83],amber:[170,115,30],purple:[105,74,150],soft:[247,248,249],white:[255,255,255]};function entries(){try{return (JSON.parse(localStorage.getItem(K))||{}).entries||[]}catch{return[]}}const has=v=>v!==null&&v!==undefined&&v!=='';function last(es,k){for(let i=es.length-1;i>=0;i--)if(has(es[i][k]))return{v:es[i][k],ts:es[i].ts};return null}function tm(ts){return ts?new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—'}function dt(ts){return ts?new Date(ts).toLocaleString([],{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}async function makePDF(){const st=document.getElementById('status');try{if(!window.jspdf)throw Error('PDF library did not load');const es=entries().sort((a,b)=>new Date(a.ts)-new Date(b.ts));if(!es.length)throw Error('No entries found on this phone');const {jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),M=15,W=210,CW=180;let y=14,page=1;function t(s,x,yy,sz=9,b=false,col=C.ink,max=CW){d.setFont('helvetica',b?'bold':'normal');d.setFontSize(sz);d.setTextColor(...col);const ls=d.splitTextToSize(String(s),max);d.text(ls,x,yy);return ls.length*sz*.37}function rule(yy){d.setDrawColor(...C.line);d.line(M,yy,W-M,yy)}function footer(){rule(285);t('Family-maintained log · Not an official hospital medical record · Confirm with the treating team',M,290,6.5,false,C.muted,155);t(String(page),188,290,7,true,C.muted)}function np(title){footer();d.addPage();page++;y=15;t(title,M,y,18,true);y+=10}function ensure(h){if(y+h>278)np('Detailed Medical Log')}function heading(s){ensure(14);t(s.toUpperCase(),M,y,8,true,C.muted);y+=4;rule(y);y+=7}function metric(x,yy,w,label,value,time,accent,sub=''){d.setFillColor(...C.white);d.setDrawColor(...C.line);d.roundedRect(x,yy,w,31,2,2,'FD');d.setFillColor(...accent);d.rect(x,yy,w,1.3,'F');t(label,x+4,yy+7,7,true,C.muted,w-8);t(value,x+4,yy+17,16,true,C.ink,w-8);t(tm(time),x+4,yy+24,7.5,true,accent,w-8);if(sub)t(sub,x+w-4,yy+24,6.5,false,C.muted,w-8,{align:'right'})}function lc(x,yy,w,label,k,unit,accent){const o=last(es,k);metric(x,yy,w,label,o?o.v+(unit||''):'—',o&&o.ts,accent)}const latest=es[es.length-1];t('CRITICAL CARE FAMILY REPORT',M,y,8,true,C.blue);y+=8;t('Current status',M,y,22,true);t(dt(latest.ts),145,y,8,true,C.muted,50);y+=7;t('A simple view of the latest information recorded by the family.',M,y,8,false,C.muted);y+=10;heading('How is he now?');const s=last(es,'sys'),di=last(es,'dia'),bp=(s||di)?(s?s.v:'—')+'/'+(di?di.v:'—'):'—';metric(M,y,56,'BLOOD PRESSURE',bp,(s||di)&&((s||di).ts),C.red);lc(M+62,y,56,'OXYGEN','spo2','%',C.blue);lc(M+124,y,56,'HEART RATE','hr',' bpm',C.green);y+=39;heading('Important latest results');lc(M,y,56,'BLOOD LEVEL · Hb','hb',' g/dL',C.red);lc(M+62,y,56,'POTASSIUM','potassium',' mmol/L',C.amber);lc(M+124,y,56,'BLOOD ACIDITY · pH','ph','',C.blue);y+=39;heading('Current treatment / support');let rows=[];const od=last(es,'o2device'),of=last(es,'o2flow'),ad=last(es,'adrenaline'),adm=last(es,'adrenalineml'),nd=last(es,'norad'),ndm=last(es,'noradml');if(od||of)rows.push(['Oxygen',((od&&od.v)||'Oxygen')+(of?' · '+of.v+' L/min':''),(of||od).ts,C.blue]);if(ad)rows.push(['Blood-pressure medicine','Adrenaline '+ad.v+' ug/kg/min'+(adm?' · pump '+adm.v+' mL/hr':''),ad.ts,C.red]);if(nd)rows.push(['Blood-pressure medicine','Noradrenaline '+nd.v+' ug/kg/min'+(ndm?' · pump '+ndm.v+' mL/hr':''),nd.ts,C.red]);const all=es.map(e=>((e.tags||[]).join(' ')+' '+(e.notes||'')).toLowerCase()).join(' ');if(all.includes('transfus'))rows.push(['Blood transfusion','Planned / recorded in family notes','',C.purple]);if(all.includes('potassium')&&(all.includes('calcium')||all.includes('bicarbonate')||all.includes('nebul')))rows.push(['High-potassium treatment','Treatment recorded in family notes','',C.amber]);if(!rows.length){t('No treatment/support details recorded.',M,y,9,false,C.muted);y+=9}else for(const r of rows.slice(0,5)){ensure(13);d.setFillColor(...r[3]);d.circle(M+2,y+4,1.2,'F');t(r[0],M+7,y+5,9,true,C.ink,48);t(r[1],M+58,y+5,8.5,false,C.ink,92);if(r[2])t(tm(r[2]),176,y+5,7.5,true,r[3],18);y+=11}heading('Recent timeline');d.setFillColor(...C.soft);d.rect(M,y,CW,8,'F');t('TIME',M+3,y+5.5,7,true,C.muted);t('BP',M+32,y+5.5,7,true,C.muted);t('OXYGEN',M+62,y+5.5,7,true,C.muted);t('HR',M+94,y+5.5,7,true,C.muted);t('EVENT / NOTE',M+116,y+5.5,7,true,C.muted);y+=9;for(const e of es.slice(-8).reverse()){ensure(13);const bpv=(has(e.sys)||has(e.dia))?(has(e.sys)?e.sys:'—')+'/'+(has(e.dia)?e.dia:'—'):'—',ox=has(e.spo2)?e.spo2+'%':'—',hr=has(e.hr)?e.hr:'—';let ev='';if(e.tags&&e.tags.length)ev=e.tags.join(', ');if(e.notes)ev+=(ev?' · ':'')+e.notes;rule(y);t(tm(e.ts),M+3,y+6,8,true,C.purple,25);t(bpv,M+32,y+6,8,true,C.ink,27);t(ox,M+62,y+6,8,true,C.ink,28);t(hr,M+94,y+6,8,true,C.ink,18);t(ev||'—',M+116,y+5,7.2,false,C.ink,62);y+=12}footer();d.addPage();page++;y=15;t('Detailed Medical Log',M,y,18,true);y+=6;t('Exact information as entered in the family log',M,y,8,false,C.muted);y+=9;for(const e of es){let a=[];if(has(e.sys)||has(e.dia))a.push('BP '+(has(e.sys)?e.sys:'—')+'/'+(has(e.dia)?e.dia:'—'));[['map','MAP'],['hr','HR'],['spo2','SpO2 %'],['rr','RR'],['temp','Temp C'],['o2device','O2 device'],['o2flow','O2 L/min'],['norad','Noradrenaline'],['noradml','Norad pump mL/hr'],['adrenaline','Adrenaline'],['adrenalineml','Adrenaline pump mL/hr'],['potassium','Potassium'],['ph','pH'],['hb','Hb'],['lactate','Lactate'],['hco3','HCO3'],['creatinine','Creatinine'],['ivIn','IV input mL'],['enteralIn','Feed/input mL'],['urineOut','Urine mL']].forEach(([k,l])=>{if(has(e[k]))a.push(l+' '+e[k])});if(e.tags&&e.tags.length)a.push('Events: '+e.tags.join(', '));if(e.notes)a.push('Note: '+e.notes);const body=a.join(' · ')||'Entry saved',lines=d.splitTextToSize(body,142),h=Math.max(14,lines.length*4+6);ensure(h);t(dt(e.ts),M,y+5,8,true,C.purple,32);t(body,M+36,y+5,8,false,C.ink,142);y+=h;rule(y-3)}footer();const blob=d.output('blob'),name='Critical-Care-Family-Report-'+new Date().toISOString().slice(0,10)+'.pdf',file=new File([blob],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){st.textContent='V4 PDF created. Opening share sheet...';await navigator.share({files:[file],title:'Critical Care Family Report'});st.textContent='V4 PDF created successfully.'}else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.textContent='Open V4 PDF';a.style='display:block;margin-top:12px;color:#66b7ff;font-weight:700';st.innerHTML='V4 PDF created.';st.appendChild(a)}}catch(e){st.textContent='Could not create PDF: '+e.message}}</script></body></html>
