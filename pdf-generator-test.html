<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Direct PDF Export Test</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0b1014;color:#f4f7f9;margin:0;padding:24px}.wrap{max-width:600px;margin:auto}h1{font-size:26px}.muted{color:#9eabb5;line-height:1.5}.btn{width:100%;border:0;border-radius:14px;padding:16px;margin-top:14px;font-size:17px;font-weight:700;background:#66b7ff;color:#071018}.status{margin-top:18px;padding:14px;border:1px solid #26333d;border-radius:12px;line-height:1.5}</style></head><body><div class="wrap"><h1>Family PDF Export Test</h1><p class="muted">This test reads the same entries stored on this phone and generates a real PDF file locally. It does not modify the Critical Care Log.</p><button class="btn" onclick="makePDF()">Generate & Share Family PDF</button><div class="status" id="status">Ready.</div></div><script>const K='critical-care-log-v1';const val=(x,f='Not recorded')=>x===null||x===undefined||x===''?f:String(x);function entries(){try{return (JSON.parse(localStorage.getItem(K))||{}).entries||[]}catch{return[]}}function last(es,k){for(let i=es.length-1;i>=0;i--)if(es[i][k]!==null&&es[i][k]!==undefined&&es[i][k]!=='')return es[i][k];return null}function total(es,k){return es.reduce((s,e)=>s+(Number(e[k])||0),0)}function fmt(ts){return ts?new Date(ts).toLocaleString():'Not recorded'}async function makePDF(){const st=document.getElementById('status');try{if(!window.jspdf)throw new Error('PDF library did not load. Internet connection may be required for this test page.');const es=entries().sort((a,b)=>new Date(a.ts)-new Date(b.ts));if(!es.length)throw new Error('No entries found in this browser storage. Open this page from the same Safari/PWA storage context as the log.');const latest=es[es.length-1];const {jsPDF}=window.jspdf;const d=new jsPDF({unit:'mm',format:'a4'});const W=210,M=15,CW=W-M*2;let y=17,page=1;const line=(t,size=10,bold=false,indent=0)=>{d.setFont('helvetica',bold?'bold':'normal');d.setFontSize(size);const ls=d.splitTextToSize(String(t),CW-indent);if(y+ls.length*(size*.42)>282){footer();d.addPage();page++;y=17}d.text(ls,M+indent,y);y+=ls.length*(size*.42)+2};const section=t=>{y+=3;line(t,14,true);d.setDrawColor(210);d.line(M,y-1,W-M,y-1);y+=2};const footer=()=>{d.setFont('helvetica','normal');d.setFontSize(7);d.setTextColor(100);d.text('Family-maintained log. Not an official hospital medical record. Verify values with the treating team.',M,290);d.text('Page '+page,W-M,290,{align:'right'});d.setTextColor(0)};line('Family Care Update',20,true);line('Latest family entry: '+fmt(latest.ts),9);line('Generated: '+new Date().toLocaleString(),9);section('Current recorded readings');line('Blood pressure: '+(latest.sys!=null||latest.dia!=null?val(latest.sys,'-')+'/'+val(latest.dia,'-')+' mmHg':'Not recorded'),11,true);line('MAP: '+val(latest.map)+(latest.map!=null?' mmHg':''));line('Heart rate: '+val(latest.hr)+(latest.hr!=null?' bpm':''));line('Oxygen saturation: '+val(latest.spo2)+(latest.spo2!=null?'%':''));line('Breathing rate: '+val(latest.rr)+(latest.rr!=null?' /min':''));line('Temperature: '+val(latest.temp)+(latest.temp!=null?' C':''));section('Current support recorded');line('Oxygen: '+val(last(es,'o2device'))+(last(es,'o2flow')!=null?' at '+last(es,'o2flow')+' L/min':''));if(last(es,'norad')!=null)line('Noradrenaline: '+last(es,'norad')+' ug/kg/min'+(last(es,'noradml')!=null?' | pump '+last(es,'noradml')+' mL/hr':''));if(last(es,'adrenaline')!=null)line('Adrenaline: '+last(es,'adrenaline')+' ug/kg/min'+(last(es,'adrenalineml')!=null?' | pump '+last(es,'adrenalineml')+' mL/hr':''));section('Recorded fluid balance');const input=total(es,'ivIn')+total(es,'enteralIn'),urine=total(es,'urineOut'),net=input-urine;line('Input recorded: '+input+' mL');line('Urine recorded: '+urine+' mL');line('Net recorded balance: '+(net>=0?'+':'')+net+' mL',11,true);line('These totals only include entries saved in this family log and may differ from the hospital fluid chart.',8);section('Latest recorded blood results');const labs=[['Hemoglobin (blood level)','hb','g/dL'],['Potassium','potassium','mmol/L'],['Blood acidity (pH)','ph',''],['Lactate','lactate','mmol/L'],['Bicarbonate','hco3','mmol/L'],['Creatinine','creatinine','umol/L'],['Troponin','troponin','ng/L']];let any=false;for(const [n,k,u] of labs){const v=last(es,k);if(v!=null){any=true;line(n+': '+v+(u?' '+u:''),10,true)}}if(!any)line('No blood results recorded.');section('Recent important events');const ev=es.filter(e=>(e.tags&&e.tags.length)||e.notes).slice(-10).reverse();if(!ev.length)line('No event notes recorded.');for(const e of ev){line(fmt(e.ts),9,true);if(e.tags&&e.tags.length)line(e.tags.join(' | '),9,false,3);if(e.notes)line(e.notes,9,false,3)}section('Detailed timeline');for(const e of es){line(fmt(e.ts),9,true);let a=[];if(e.sys!=null||e.dia!=null)a.push('BP '+val(e.sys,'-')+'/'+val(e.dia,'-'));[['map','MAP'],['hr','HR'],['spo2','SpO2'],['rr','RR'],['o2flow','O2 L/min'],['norad','Norad'],['adrenaline','Adrenaline'],['potassium','K'],['ph','pH'],['hb','Hb'],['lactate','Lactate'],['ivIn','IV input mL'],['enteralIn','Feed/input mL'],['urineOut','Urine mL']].forEach(([k,l])=>{if(e[k]!=null&&e[k]!=='')a.push(l+' '+e[k])});if(a.length)line(a.join(' | '),8,false,3);if(e.notes)line(e.notes,8,false,3)}footer();const blob=d.output('blob');const name='Family-Care-Update-'+new Date().toISOString().slice(0,10)+'.pdf';const file=new File([blob],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){st.textContent='PDF created. Opening iPhone share sheet...';await navigator.share({files:[file],title:'Family Care Update'});st.textContent='PDF created successfully.'}else{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.textContent='Tap here to open/download the generated PDF';a.style='display:block;margin-top:12px;color:#66b7ff;font-weight:700';st.innerHTML='PDF created. Direct file sharing is not available in this browser.';st.appendChild(a)}}catch(e){st.textContent='Could not create PDF: '+e.message}}</script></body></html>
