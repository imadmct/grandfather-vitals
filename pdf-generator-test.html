<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Simple Family PDF Test</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0b1014;color:#f4f7f9;margin:0;padding:24px}.wrap{max-width:600px;margin:auto}h1{font-size:26px}.muted{color:#9eabb5;line-height:1.5}.btn{width:100%;border:0;border-radius:14px;padding:16px;margin-top:14px;font-size:17px;font-weight:700;background:#66b7ff;color:#071018}.status{margin-top:18px;padding:14px;border:1px solid #26333d;border-radius:12px;line-height:1.5}</style></head><body><div class="wrap"><h1>Simple Family PDF</h1><p class="muted">Page 1 is designed for family. Page 2 keeps the full recorded medical log.</p><button class="btn" onclick="makePDF()">Generate & Share PDF</button><div class="status" id="status">Ready.</div></div><script>const K='critical-care-log-v1';const C={ink:[24,34,44],muted:[91,105,117],blue:[226,241,253],blueA:[29,103,164],red:[253,232,234],redA:[165,55,69],green:[227,246,235],greenA:[31,121,72],yellow:[255,244,207],yellowA:[150,101,15],purple:[241,232,252],purpleA:[105,59,151],gray:[242,245,247],line:[218,224,229],white:[255,255,255]};function getEntries(){try{return (JSON.parse(localStorage.getItem(K))||{}).entries||[]}catch{return[]}}function present(v){return v!==null&&v!==undefined&&v!==''}function last(es,k){for(let i=es.length-1;i>=0;i--)if(present(es[i][k]))return {v:es[i][k],ts:es[i].ts};return null}function fmt(ts){return ts?new Date(ts).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}async function makePDF(){const status=document.getElementById('status');try{if(!window.jspdf)throw Error('PDF library did not load.');const es=getEntries().sort((a,b)=>new Date(a.ts)-new Date(b.ts));if(!es.length)throw Error('No entries found on this phone.');const {jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),M=14,W=210,CW=182;let y=15,page=1;const text=(t,x,yy,size=9,bold=false,col=C.ink,max=CW)=>{d.setFont('helvetica',bold?'bold':'normal');d.setFontSize(size);d.setTextColor(...col);const lines=d.splitTextToSize(String(t),max);d.text(lines,x,yy);return lines.length*size*.38};const footer=()=>{d.setDrawColor(...C.line);d.line(M,286,W-M,286);text('Family-maintained log. Not an official hospital medical record.',M,290,6.5,false,C.muted);text('Page '+page,181,290,6.5,true,C.muted)};const ensure=h=>{if(y+h>280){footer();d.addPage();page++;y=16;text('Detailed Medical Log',M,y,17,true);y+=10}};const card=(x,yy,w,label,value,time,bg,accent,sub='')=>{d.setFillColor(...bg);d.roundedRect(x,yy,w,31,3,3,'F');text(label,x+4,yy+6,7.3,true,accent,w-8);text(value,x+4,yy+16,15,true,C.ink,w-8);if(time)text(fmt(time),x+4,yy+23,7.2,true,C.muted,w-8);if(sub)text(sub,x+4,yy+28,5.8,false,C.muted,w-8)};const lc=(x,yy,w,label,k,unit,bg,accent,sub)=>{const o=last(es,k);card(x,yy,w,label,o?o.v+(unit||''):'Not recorded',o&&o.ts,bg,accent,sub)};text('FAMILY UPDATE',M,y,8,true,C.blueA);y+=8;text('How is he now?',M,y,22,true);y+=7;text('Latest recorded readings, with the time each value was entered.',M,y,8,false,C.muted);y+=9;const sys=last(es,'sys'),dia=last(es,'dia');let bp='Not recorded',bpts='';if(sys||dia){bp=(sys?sys.v:'-')+'/'+(dia?dia.v:'-');bpts=(sys||dia).ts}card(M,y,57,'BLOOD PRESSURE',bp,bpts,C.red,C.redA,'BP');lc(M+62,y,57,'OXYGEN','spo2','%',C.blue,C.blueA,'SpO2');lc(M+124,y,57,'HEART RATE','hr',' bpm',C.green,C.greenA,'HR');y+=39;text('Important latest results',M,y,14,true);y+=7;lc(M,y,57,'BLOOD LEVEL','hb',' g/dL',C.red,C.redA,'Hemoglobin (Hb)');lc(M+62,y,57,'POTASSIUM','potassium',' mmol/L',C.yellow,C.yellowA,'Blood salt');lc(M+124,y,57,'BLOOD ACIDITY','ph','',C.blue,C.blueA,'pH');y+=39;text('What is being done',M,y,14,true);y+=7;let supports=[];const od=last(es,'o2device'),of=last(es,'o2flow'),ad=last(es,'adrenaline'),nd=last(es,'norad');if(od||of)supports.push(['Oxygen',((od&&od.v)||'Oxygen')+(of?' · '+of.v+' L/min':''),(of||od).ts]);if(ad)supports.push(['Blood-pressure medicine','Adrenaline '+ad.v+' ug/kg/min',ad.ts]);if(nd)supports.push(['Blood-pressure medicine','Noradrenaline '+nd.v+' ug/kg/min',nd.ts]);const alltxt=es.map(e=>((e.tags||[]).join(' ')+' '+(e.notes||'')).toLowerCase()).join(' ');if(alltxt.includes('transfus'))supports.push(['Blood transfusion','Recorded in family notes','']);if(alltxt.includes('potassium')&&(alltxt.includes('calcium')||alltxt.includes('bicarbonate')||alltxt.includes('nebul')))supports.push(['High-potassium treatment','Recorded in family notes','']);if(!supports.length){text('No treatment/support details recorded.',M,y,9,false,C.muted);y+=9}else{for(const s of supports.slice(0,5)){d.setFillColor(...C.purple);d.roundedRect(M,y,CW,14,2,2,'F');text(s[0],M+4,y+6,9,true,C.purpleA,48);text(s[1],M+55,y+6,9,true,C.ink,90);if(s[2])text(fmt(s[2]),M+148,y+6,7,true,C.muted,30);y+=17}}text('Timeline',M,y+2,14,true);y+=10;text('TIME',M,y,7,true,C.blueA);text('WHAT WAS RECORDED',M+31,y,7,true,C.muted);y+=5;for(const e of es.slice(-10)){ensure(15);let a=[];if(present(e.sys)||present(e.dia))a.push('BP '+(present(e.sys)?e.sys:'-')+'/'+(present(e.dia)?e.dia:'-'));if(present(e.spo2))a.push('Oxygen '+e.spo2+'%');if(present(e.hr))a.push('HR '+e.hr);if(present(e.hb))a.push('Hb '+e.hb);if(present(e.potassium))a.push('Potassium '+e.potassium);if(present(e.ph))a.push('pH '+e.ph);if(e.tags&&e.tags.length)a.push(e.tags.join(', '));if(e.notes)a.push(e.notes);d.setFillColor(...C.gray);d.roundedRect(M,y,CW,12,2,2,'F');text(fmt(e.ts),M+4,y+6,8.5,true,C.blueA,26);text(a.join(' · ')||'Entry saved',M+34,y+5,8,true,C.ink,CW-38);y+=15}footer();d.addPage();page++;y=16;text('Detailed Medical Log',M,y,18,true);y+=6;text('Exact values as entered in the family log',M,y,8,false,C.muted);y+=9;for(const e of es){let a=[];if(present(e.sys)||present(e.dia))a.push('BP '+(present(e.sys)?e.sys:'-')+'/'+(present(e.dia)?e.dia:'-'));[['map','MAP'],['hr','HR'],['spo2','SpO2 %'],['rr','RR'],['temp','Temp C'],['o2device','O2 device'],['o2flow','O2 L/min'],['norad','Noradrenaline'],['noradml','Norad pump mL/hr'],['adrenaline','Adrenaline'],['adrenalineml','Adrenaline pump mL/hr'],['potassium','Potassium'],['ph','pH'],['hb','Hb'],['lactate','Lactate'],['hco3','HCO3'],['creatinine','Creatinine'],['ivIn','IV input mL'],['enteralIn','Feed/input mL'],['urineOut','Urine mL']].forEach(([k,l])=>{if(present(e[k]))a.push(l+' '+e[k])});if(e.tags&&e.tags.length)a.push('Events: '+e.tags.join(', '));if(e.notes)a.push('Note: '+e.notes);const body=a.join(' | ')||'Entry saved';const lines=d.splitTextToSize(body,145),h=Math.max(14,lines.length*4+6);ensure(h);d.setFillColor(...C.gray);d.roundedRect(M,y,CW,h-2,2,2,'F');text(fmt(e.ts),M+4,y+6,8,true,C.blueA,27);text(body,M+34,y+5,8,false,C.ink,143);y+=h}footer();const blob=d.output('blob'),name='Family-Update-'+new Date().toISOString().slice(0,10)+'.pdf',file=new File([blob],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){status.textContent='PDF created. Opening share sheet...';await navigator.share({files:[file],title:'Family Update'});status.textContent='PDF created successfully.'}else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.textContent='Open generated PDF';a.style='display:block;margin-top:12px;color:#66b7ff;font-weight:700';status.innerHTML='PDF created.';status.appendChild(a)}}catch(e){status.textContent='Could not create PDF: '+e.message}}</script></body></html>
