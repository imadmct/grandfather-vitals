<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Care Update Preview</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:#eef2f5;color:#17212b}.wrap{max-width:820px;margin:auto;padding:18px}.bar{display:flex;gap:10px;margin-bottom:14px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:#17212b;color:white}.paper{background:white;padding:34px;border-radius:14px;box-shadow:0 2px 12px #0001}h1{margin:0;font-size:30px}.muted{color:#65717c}.section{margin-top:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border:1px solid #d9e0e5;border-radius:10px;padding:14px}.card small{display:block;color:#687581;font-size:11px;text-transform:uppercase}.card b{font-size:21px}.support{padding:12px 0;border-bottom:1px solid #e4e8eb}.lab{display:grid;grid-template-columns:1.3fr .7fr 2fr;gap:10px;padding:10px 0;border-bottom:1px solid #e4e8eb}.event{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #e4e8eb}.foot{margin-top:28px;padding-top:12px;border-top:1px solid #ccd4da;font-size:11px;color:#6b7680}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.lab{grid-template-columns:1fr}.event{grid-template-columns:1fr}.paper{padding:20px}}@media print{body{background:white}.wrap{max-width:none;padding:0}.bar{display:none}.paper{box-shadow:none;border-radius:0;padding:12mm}h2{break-after:avoid}.event,.lab,.card{break-inside:avoid}@page{size:A4;margin:12mm}}</style></head><body><div class="wrap"><div class="bar"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn" onclick="location.reload()">Refresh data</button></div><div class="paper" id="report"></div></div><script>const K='critical-care-log-v1';const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));let db={entries:[]};try{db=JSON.parse(localStorage.getItem(K))||db}catch{}const es=[...(db.entries||[])].sort((a,b)=>new Date(a.ts)-new Date(b.ts));const latest=[...es].reverse()[0]||{};const last=k=>{for(let i=es.length-1;i>=0;i--)if(es[i][k]!=null)return es[i][k];return null};const total=k=>es.reduce((s,e)=>s+(Number(e[k])||0),0);const fmt=x=>x?new Date(x).toLocaleString([],{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'Not recorded';const metric=(l,v,u='')=>`<div class="card"><small>${l}</small><b>${v??'Not recorded'}${v!=null&&u?' '+u:''}</b></div>`;const labs=[['Hemoglobin (Hb)','hb','g/dL','Amount of oxygen-carrying hemoglobin recorded.'],['Potassium','potassium','mmol/L','Blood potassium result recorded by the family.'],['Blood acidity (pH)','ph','','Blood gas pH result recorded by the family.'],['Lactate','lactate','mmol/L','Blood lactate result recorded by the family.'],['Bicarbonate (HCO₃)','hco3','mmol/L','Blood bicarbonate result recorded by the family.'],['Creatinine','creatinine','µmol/L','A blood result used by clinicians when assessing kidney function.'],['Troponin','troponin','ng/L','Heart-related blood marker result recorded by the family.']];let input=total('ivIn')+total('enteralIn'),urine=total('urineOut'),net=input-urine;let support=[];if(last('o2device')||last('o2flow')!=null)support.push(`<div class="support"><b>Oxygen support</b><br>${esc(last('o2device')||'Device not recorded')}${last('o2flow')!=null?' at '+esc(last('o2flow'))+' L/min':''}</div>`);if(last('norad')!=null)support.push(`<div class="support"><b>Noradrenaline recorded</b><br>${esc(last('norad'))} µg/kg/min${last('noradml')!=null?' · pump '+esc(last('noradml'))+' mL/hr':''}</div>`);if(last('adrenaline')!=null)support.push(`<div class="support"><b>Adrenaline recorded</b><br>${esc(last('adrenaline'))} µg/kg/min${last('adrenalineml')!=null?' · pump '+esc(last('adrenalineml'))+' mL/hr':''}</div>`);let events=es.filter(e=>(e.tags&&e.tags.length)||e.notes).slice(-10).reverse();document.getElementById('report').innerHTML=`<h1>Family Care Update</h1><div class="muted">Latest family entry: ${fmt(latest.ts)} · Generated ${new Date().toLocaleString()}</div><div class="section"><h2>Latest recorded readings</h2><div class="grid">${metric('Blood pressure',latest.sys!=null||latest.dia!=null?(latest.sys??'–')+'/'+(latest.dia??'–'):'Not recorded','mmHg')}${metric('MAP',latest.map,'mmHg')}${metric('Heart rate',latest.hr,'bpm')}${metric('Oxygen saturation',latest.spo2,'%')}${metric('Breathing rate',latest.rr,'/min')}${metric('Temperature',latest.temp,'°C')}</div></div><div class="section"><h2>Support currently recorded</h2>${support.join('')||'<div class="muted">No current support details recorded in the latest data.</div>'}</div><div class="section"><h2>Recorded fluid balance</h2><div class="grid">${metric('Input',input,'mL')}${metric('Urine output',urine,'mL')}${metric('Net recorded balance',(net>=0?'+':'')+net,'mL')}</div><p class="muted">Totals are based only on entries saved in this family log and may not match the hospital fluid chart.</p></div><div class="section"><h2>Latest recorded blood results</h2>${labs.map(([n,k,u,d])=>{let v=last(k);return v==null?'':`<div class="lab"><b>${n}</b><span>${esc(v)} ${u}</span><span class="muted">${d}</span></div>`}).join('')||'<div class="muted">No blood results recorded.</div>'}</div><div class="section"><h2>Recent important events</h2>${events.map(e=>`<div class="event"><b>${fmt(e.ts)}</b><div>${(e.tags||[]).length?'<b>'+e.tags.map(esc).join(' · ')+'</b><br>':''}${e.notes?esc(e.notes):''}</div></div>`).join('')||'<div class="muted">No event notes recorded.</div>'}</div><div class="section"><h2>Detailed timeline</h2>${es.map(e=>{let a=[];if(e.sys!=null||e.dia!=null)a.push('BP '+(e.sys??'–')+'/'+(e.dia??'–'));[['map','MAP'],['hr','HR'],['spo2','SpO₂'],['rr','RR'],['o2flow','O₂ L/min'],['norad','Norad'],['adrenaline','Adrenaline'],['potassium','K'],['ph','pH'],['hb','Hb'],['lactate','Lactate'],['urineOut','Urine mL']].forEach(([k,l])=>{if(e[k]!=null)a.push(l+' '+e[k])});return `<div class="event"><b>${fmt(e.ts)}</b><div>${esc(a.join(' · '))}${e.notes?'<br>'+esc(e.notes):''}</div></div>`}).join('')}</div><div class="foot">Family-maintained log. Not an official hospital medical record. Values should be verified with the treating team before clinical decisions.</div>`;</script></body></html>
