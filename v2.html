<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101417"><meta name="apple-mobile-web-app-capable" content="yes"><title>Critical Care Log</title><style>:root{--bg:#0d1114;--p:#151b20;--p2:#1b2329;--line:#2b353c;--t:#f4f7f8;--m:#9cabb5;--b:#70b7ff;--r:#ff7b73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:88px}.w{max-width:680px;margin:auto;padding:0 14px}header{position:sticky;top:0;z-index:5;background:#0d1114f2;backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top,0px) + 14px) 2px 9px;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0}.sub,.hint{font-size:12px;color:var(--m);line-height:1.45}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.07em}.body{padding:13px}.latest{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}.metric{background:var(--p);padding:12px 10px;min-height:84px}.metric small,.box small,label{display:block;color:var(--m);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.metric b{display:block;font-size:24px}.metric em{font-style:normal;font-size:10px;color:var(--m);margin-left:3px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}input,select,textarea{width:100%;background:var(--p2);color:var(--t);border:1px solid var(--line);border-radius:11px;padding:11px 9px;font-size:17px;min-height:45px}textarea{min-height:76px;font-size:14px}.f{margin-bottom:9px}.btn{width:100%;border:0;border-radius:12px;mi orad','noradml','adrenaline','adrenalineml','ivIn','enteralIn','urineOut','lactate','ph','hco3','hb','creatinine','troponin','sodium','potassium'];let db=load(),view='now',editId=null,tags=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function load(){try{let x=JSON.parse(localStorage.getItem(K));return x&&Array.isArray(x.entries)?x:{entries:[]}}catch{return{entries:[]}}}function save(){localStorage.setItem(K,JSON.stringify(db))}function nowLocal(){let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*6e4).toISOString().slice(0,16)}function fmt(x){return new Date(x).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}function n(x){x=parseFloat(x);return Number.isFinite(x)?x:null}function total(k){return db.entries.reduce((s,e)=>s+(Number(e[k])||0),0)}function latest(k){for(const e of [...db.entries].sort((a,b)=>new Date(b.ts)-new Date(a.ts)))if(e[k]!=null)return e[k];return null}function metric(l,v,u=''){return `<div class="metric"><small>${l}</small><b>${v??'–'}<em>${u}</em></b></div>`}function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.v===view));$('#app').innerHTML=view==='now'?screenNow():view==='add'?screenAdd():view==='timeline'?screenTimeline():screenData();bind()}function screenNow(){let e=[...db.entries].sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0];if(!e)return '<div class="card"><div class="body hint">No entries yet. Tap Add to start.</div></div>';let bal=total('ivIn')+total('enteralIn')-total('urineOut');return `<div class="card"><div class="head"><span>Latest</span><span>${fmt(e.ts)}</span></div><div class="latest">${metric('BP',e.sys!=null&&e.dia!=null?e.sys+'/'+e.dia:'–','mmHg')}${metric('MAP',e.map,'mmHg')}${metric('HR',e.hr,'bpm')}${metric('SpO₂',e.spo2,'%')}${metric('RR',e.rr,'/min')}${metric('O₂',e.o2flow,'L/min')}${metric('Norad',e.norad,'µg/kg/min')}${metric('Adrenaline',e.adrenaline,'µg/kg/min')}${metric('Lactate',e.lactate,'mmol/L')}</div></div><div class="card"><div class="head">Recorded fluid balance</div><div class="body"><div class="sum"><div class="box"><small>Input</small><b>${total('ivIn')+total('enteralIn')} mL</b></div><div class="box"><small>Urine</small><b>${total('urineOut')} mL</b></div><div class="box"><small>Net</small><b>${bal>=0?'+':''}${bal} mL</b></div></div><p class="hint">Based only on entries saved here, not the official hospital chart.</p></div></div><div class="card"><div class="head">Latest labs</div><div class="latest">${metric('pH',latest('ph'))}${metric('HCO₃',latest('hco3'),'mmol/L')}${metric('Hb',latest('hb'),'g/dL')}${metric('Creatinine',latest('creatinine'),'µmol/L')}${metric('Troponin',latest('troponin'),'ng/L')}${metric('K',latest('potassium'),'mmol/L')}</div></div>`}function fld(id,l,v='',step='any'){return `<div class="f"><label>${l}</label><input id="${id}" type="number" inputmode="decimal" step="${step}" value="${esc(v)}"></div>`}function screenAdd(){let e=editId?db.entries.find(x=>String(x.id)===String(editId)):null,g=(k,d='')=>e?.[k]??d;if(e)tags=[...(e.tags||[])];let devices=['','Nasal cannula','Simple mask','Non-rebreather mask','High-flow nasal oxygen','NIV / BiPAP','Ventilator','Room air'];return `<div class="card"><div class="head"><span>${e?'Edit saved entry':'New entry'}</span>${e?'<button id="cancel" class="chip">Cancel</button>':''}</div><div class="body"><div class="f"><label>Timestamp</label><input id="ts" type="datetime-local" value="${esc(g('ts',nowLocal()))}"></div></div></div><div class="card"><div class="head">Vitals</div><div class="body"><div class="grid3">${fld('sys','Systolic BP',g('sys'))}${fld('dia','Diastolic BP',g('dia'))}${fld('map','MAP',g('map'))}${fld('hr','Heart rate',g('hr'))}${fld('spo2','SpO₂',g('spo2'))}${fld('rr','Resp rate',g('rr'))}${fld('temp','Temperature °C',g('temp'),'0.1')}</div></div></div><div class="card"><div class="head">Oxygen</div><div class="body"><div class="grid"><div class="f"><label>Device</label><select id="o2device">${devices.map(d=>`<option value="${d}" ${g('o2device')===d?'selected':''}>${d||'Not entered'}</option>`).join('')}</select></div>${fld('o2flow','O₂ flow L/min',g('o2flow'))}</div></div></div><div class="card"><div class="head">Vasopressors</div><div class="body"><div class="grid">${fld('norad','Norad µg/kg/min',g('norad'),'0.01')}${fld('noradml','Norad pump mL/hr',g('noradml'),'0.1')}${fld('adrenaline','Adrenaline µg/kg/min',g('adrenaline'),'0.01')}${fld('adrenalineml','Adrenaline pump mL/hr',g('adrenalineml'),'0.1')}</div></div></div><div class="card"><div class="head">Fluids since last entry</div><div class="body"><div class="grid3">${fld('ivIn','IV input mL',g('ivIn'))}${fld('enteralIn','Feed/input mL',g('enteralIn'))}${fld('urineOut','Urine mL',g('urineOut'))}</div></div></div><div class="card"><div class="head">Labs</div><div class="body"><div class="grid3">${fld('lactate','Lactate',g('lactate'),'0.01')}${fld('ph','pH',g('ph'),'0.01')}${fld('hco3','HCO₃',g('hco3'),'0.1')}${fld('hb','Hb g/dL',g('hb'),'0.1')}${fld('creatinine','Creatinine',g('creatinine'))}${fld('troponin','Troponin',g('troponin'))}${fld('sodium','Sodium',g('sodium'),'0.1')}${fld('potassium','Potassium',g('potassium'),'0.1')}</div></div></div><div class="card"><div class="head">Event / notes</div><div class="body"><div class="chips">${['BP drop','O₂ drop','HR spike','Fluid bolus','Blood transfusion','Norad ↑','Norad ↓','Adrenaline started','ABG','CBC','Ultrasound','Suction'].map(t=>`<button class="chip ${tags.includes(t)?'on':''}" data-tag="${t}" type="button">${t}</button>`).join('')}</div><div class="f" style="margin-top:12px"><label>Notes</label><textarea id="notes">${esc(g('notes'))}</textarea></div><button id="saveEntry" class="btn">${e?'Save changes':'Save timestamped entry'}</button></div></div>`}function screenTimeline(){let a=[...db.entries].sort((a,b)=>new Date(b.ts)-new Date(a.ts));if(!a.length)return '<div class="card"><div class="body hint">No timeline entries yet.</div></div>';return `<div class="card">${a.map(e=>{let v=[];if(e.sys!=null||e.dia!=null)v.push(`<span><i>BP</i>${e.sys??'–'}/${e.dia??'–'}</span>`);[['map','MAP',''],['hr','HR',''],['spo2','SpO₂','%'],['rr','RR',''],['o2flow','O₂','L'],['norad','Norad',''],['adrenaline','Adr',''],['lactate','Lactate',''],['ph','pH',''],['hb','Hb',''],['urineOut','Urine','mL']].forEach(([k,l,u])=>{if(e[k]!=null)v.push(`<span><i>${l}</i>${e[k]}${u}</span>`)});return `<div class="item"><div class="time">${fmt(e.ts)}</div><div class="vals">${v.join('')}</div>${(e.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${e.notes?`<div class="note">${esc(e.notes)}</div>`:''}<div class="row" style="margin-top:9px"><button class="chip" data-edit="${e.id}">Edit</button><button class="chip danger" data-del="${e.id}">Delete</button></div></div>`}).join('')}</div>`}function screenData(){return `<div class="card"><div class="head">Family report</div><div class="body"><button id="pdf" class="btn">Export / Save PDF</button><p class="hint">Creates a clean report with latest values, recorded fluid balance and the full timestamped timeline. On iPhone use Print, expand the preview, then Share.</p></div></div><div class="card"><div class="head">Backup</div><div class="body"><div class="row"><button id="json" class="btn btn2">JSON</button><button id="csv" class="btn btn2">CSV</button></div><div class="sep"></div><div class="f"><label>Import JSON backup</label><input id="import" type="file" accept=".json,application/json"></div><button id="clear" class="btn btn2 danger">Delete all local data</button></div></div>`}function val(id){return $('#'+id)?.value??''}function bind(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(view==='add'&&b.dataset.v!=='add'){editId=null;tags=[]}view=b.dataset.v;render()});document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{let t=b.dataset.tag;b.classList.toggle('on');tags=b.classList.contains('on')?[...new Set([...tags,t])]:tags.filter(x=>x!==t)});if($('#cancel'))$('#cancel').onclick=()=>{editId=null;tags=[];view='timeline';render()};if($('#saveEntry'))$('#saveEntry').onclick=()=>{let old=editId?db.entries.find(x=>String(x.id)===String(editId)):null,e={id:old?.id??(crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()),ts:val('ts'),tags:[...tags],notes:val('notes'),o2device:val('o2device')};numKeys.forEach(k=>{let x=n(val(k));if(x!=null)e[k]=x});if(e.map==null&&e.sys!=null&&e.dia!=null)e.map=Math.round((e.sys+2*e.dia)/3);if(editId)db.entries=db.entries.map(x=>String(x.id)===String(editId)?e:x);else db.entries.push(e);save();editId=null;tags=[];view='now';render()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editId=b.dataset.edit;tags=[...(db.entries.find(x=>String(x.id)===String(editId))?.tags||[])];view='add';render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this entry?')){db.entries=db.entries.filter(x=>String(x.id)!==b.dataset.del);save();render()}});if($('#pdf'))$('#pdf').onclick=pdf;if($('#json'))$('#json').onclick=()=>download('critical-care-log.json',JSON.stringify(db,null,2),'application/json');if($('#csv'))$('#csv').onclick=csv;if($('#import'))$('#import').onchange=async ev=>{try{let j=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(j.entries))throw 0;db=j;save();alert('Backup imported');render()}catch{alert('Invalid backup')}};if($('#clear'))$('#clear').onclick=()=>{if(confirm('Delete every saved entry from this phone?')){db={entries:[]};save();render()}}}function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function csv(){let ks=['ts',...numKeys,'o2device','tags','notes'],rows=[ks.join(','),...db.entries.map(e=>ks.map(k=>'"'+String(k==='tags'?(e.tags||[]).join('|'):(e[k]??'')).replaceAll('"','""')+'"').join(','))];download('critical-care-log.csv',rows.join('\n'),'text/csv')}function pdf(){let a=[...db.entries].sort((x,y)=>new Date(x.ts)-new Date(y.ts));if(!a.length)return alert('No entries yet');let input=total('ivIn')+total('enteralIn'),urine=total('urineOut'),bal=input-urine,L={sys:'Systolic',dia:'Diastolic',map:'MAP',hr:'HR',spo2:'SpO₂',rr:'RR',temp:'Temp',o2device:'O₂ device',o2flow:'O₂ flow',norad:'Norad',noradml:'Norad pump',adrenaline:'Adrenaline',adrenalineml:'Adrenaline pump',ivIn:'IV input',enteralIn:'Feed/input',urineOut:'Urine',lactate:'Lactate',ph:'pH',hco3:'HCO₃',hb:'Hb',creatinine:'Creatinine',troponin:'Troponin',sodium:'Sodium',potassium:'Potassium'},O=['sys','dia','map','hr','spo2','rr','temp','o2device','o2flow','norad','noradml','adrenaline','adrenalineml','ivIn','enteralIn','urineOut','lactate','ph','hco3','hb','creatinine','troponin','sodium','potassium'],U={spo2:'%',temp:'°C',o2flow:' L/min',norad:' µg/kg/min',noradml:' mL/hr',adrenaline:' µg/kg/min',adrenalineml:' mL/hr',ivIn:' mL',enteralIn:' mL',urineOut:' mL',lactate:' mmol/L',hco3:' mmol/L',hb:' g/dL',creatinine:' µmol/L',troponin:' ng/L',sodium:' mmol/L',potassium:' mmol/L'};let latest=a[a.length-1],line=e=>O.filter(k=>e[k]!=null&&e[k]!=='').map(k=>`<b>${L[k]}:</b> ${esc(e[k])}${U[k]||''}`).join(' · '),rows=a.map(e=>`<tr><td>${esc(fmt(e.ts))}</td><td>${line(e)}${(e.tags||[]).length?`<div class="tags">${e.tags.map(esc).join(' · ')}</div>`:''}${e.notes?`<div>${esc(e.notes)}</div>`:''}</td></tr>`).join(''),w=window.open('','_blank');if(!w)return alert('Allow pop-ups for the PDF report');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Critical Care Family Report</title><style>body{font-family:-apple-system,"Segoe UI",Arial,sans-serif;margin:28px;color:#111;font-size:12px}h1{font-size:22px;margin:0}h2{font-size:14px;margin-top:20px}.muted,.tags{color:#666}.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.b{border:1px solid #bbb;
