<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1114"><title>Restore Critical Care Log</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1114;color:#f5f7f8;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:620px;margin:auto;padding:18px}.card{background:#161d22;border:1px solid #303b43;border-radius:16px;padding:16px;margin-top:16px}.muted{color:#9eabb4;line-height:1.5}.btn{width:100%;border:0;border-radius:11px;padding:14px;font-weight:700;background:#e8f3ff;color:#09131b;margin-top:12px}.btn2{background:#1d262c;color:#f5f7f8;border:1px solid #303b43}.ok{color:#70d49a}.err{color:#ff8078}h1{font-size:22px}</style></head><body><div class="w"><h1>Restore Critical Care Log</h1><div class="muted">Select your JSON backup. The file is checked before any current data is replaced.</div><div class="card"><input id="file" type="file" accept="application/json,.json" style="display:none"><button class="btn" id="choose">Choose JSON backup</button><div id="status" class="muted" style="margin-top:12px"></div><button class="btn btn2" id="back">Back to Critical Care Log</button></div></div><script>const KEY='critical-care-log-v1',f=document.getElementById('file'),s=document.getElementById('status');document.getElementById('choose').onclick=()=>f.click();document.getElementById('back').onclick=()=>location.href='./preview-v2.html?v=7';f.onchange=async()=>{const file=f.files&&f.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!x||!Array.isArray(x.entries))throw Error('This file does not contain a valid entries list.');for(const e of x.entries){if(!e||typeof e!=='object'||!e.ts)throw Error('At least one entry is invalid or missing its timestamp.')}s.innerHTML='<span class="ok">Valid backup: '+x.entries.length+' entries found.</span>';if(!confirm('Restore '+x.entries.length+' entries? This will replace the current data stored by this app on this phone.'))return;localStorage.setItem(KEY,JSON.stringify(x));const verify=JSON.parse(localStorage.getItem(KEY));if(!verify||!Array.isArray(verify.entries)||verify.entries.length!==x.entries.length)throw Error('Verification after restore failed.');s.innerHTML='<span class="ok">Restore complete. '+verify.entries.length+' entries are now loaded.</span>';setTimeout(()=>location.href='./preview-v2.html?v=7',900)}catch(e){s.innerHTML='<span class="err">Restore failed: '+String(e.message||e)+'</span>'}finally{f.value=''}};</script></body></html>
